spring.application.name=camel-azure-servicebus

# Azure Service Bus connection string (override via env var SERVICEBUS_CONNECTION_STRING for production)
servicebus.connection-string=${SERVICEBUS_CONNECTION_STRING:Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;}

camel.component.azure-servicebus.connection-string=${servicebus.connection-string}

# Delay between processing steps (ms)
service-bus-route.step-delay-ms=15000

# Set to true for the exception-handling lesson (Scenario 3 - direct dead-lettering).
# WARNING: affects ALL exception handlers - any failure dead-letters immediately instead
# of being abandoned to the broker. See docs/exception-handling.md for full explanation.
service-bus-route.enable-dead-lettering=false

server.port=8080
services:
  sql-edge:
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ServiceBus@Pass1"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/1433"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:1.1.2-arm64
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: sql-edge
      MSSQL_SA_PASSWORD: "ServiceBus@Pass1"
    volumes:
      - ./servicebus-emulator-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    ports:
      - "5672:5672"
    depends_on:
      sql-edge:
        condition: service_healthy
